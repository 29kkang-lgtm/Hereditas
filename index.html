<style>
:root{color-scheme:dark;--bg:#08090d;--panel:#10121a;--panel2:#151824;--line:#282b3b;--text:#f2f3fb;--muted:#9298b2;--blue:#aabaff;--cyan:#61d9ff;--purple:#cb9cff;--good:#9ce6c1;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:25px 15px;display:flex;flex-direction:column;gap:25px;background:#0b0c12}.brand{display:flex;gap:11px;align-items:center;padding:0 9px}.brandmark{width:36px;height:36px;flex-shrink:0}.brandname{font-weight:750;letter-spacing:.4px;font-size:17px}.tagline{color:var(--muted);font-size:11px;letter-spacing:.5px}.navlabel{color:#777e99;text-transform:uppercase;font-size:10px;letter-spacing:1.6px;padding:0 12px;margin-bottom:5px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#a8aec4;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button:hover{background:#171a27;color:white}.nav button.active{background:#1b2032;color:#dce2ff;box-shadow:inset 2px 0 var(--blue)}.navicon{width:18px;text-align:center;font-size:16px}.sidebottom{margin-top:auto;border:1px solid var(--line);border-radius:13px;padding:13px;color:var(--muted);font-size:12px}.sidebottom strong{color:var(--text);display:block;margin-bottom:4px}.main{min-width:0}.topbar{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:16px}.crumb{color:var(--muted);font-size:12px}.top-actions{display:flex;gap:9px;align-items:center}.search{background:#10121a;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text);width:min(260px,32vw)}.avatar{width:34px;height:34px;border:1px solid #454b67;border-radius:50%;display:grid;place-items:center;color:var(--blue);font-weight:700}.content{max-width:1250px;padding:32px 36px 60px;margin:auto}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.7px;color:var(--blue);font-weight:700}.headingrow{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:25px}h1{font-size:30px;line-height:1.2;letter-spacing:-.8px;margin:7px 0 8px}h2{font-size:16px;margin:0 0 14px;letter-spacing:-.2px}p{margin:0;color:var(--muted)}.btn{border:1px solid #414761;background:#191d2b;color:#e9ebff;padding:10px 14px;border-radius:10px;font-weight:600}.btn:hover{background:#242a3d;border-color:#69749d}.btn.primary{background:#c1cbff;color:#111522;border-color:#c1cbff}.btn.primary:hover{background:#d4dbff}.btn.ghost{background:transparent}.btn.danger{color:#ffb8c0;border-color:#6b3540;background:#211218}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:23px}.stat,.panel,.examcard,.classcard,.resource,.task{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.stat{padding:17px 19px}.statlabel{color:var(--muted);font-size:12px}.statvalue{font-size:27px;font-weight:700;letter-spacing:-.8px;margin:7px 0 2px}.statfoot{font-size:11px;color:#aabaff}.dashgrid{grid-template-columns:1.15fr .85fr}.panel{padding:20px;margin-bottom:16px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panelhead h2{margin:0}.mutedlink{background:none;border:0;color:var(--blue);font-size:12px}.task{padding:13px;display:flex;gap:12px;align-items:flex-start;margin-top:9px;background:#0d0f16}.taskicon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#1d2236;color:var(--blue);flex-shrink:0}.task strong,.resource strong,.examcard strong,.classcard strong{font-size:13px;display:block}.task small,.resource small,.examcard small,.classcard small{color:var(--muted);font-size:11px;display:block;margin-top:3px}.task .btn{margin-left:auto;white-space:nowrap;padding:7px 10px;font-size:11px}.examcard{padding:15px;margin-top:10px}.examtop{display:flex;justify-content:space-between;gap:12px}.pill{font-size:10px;padding:4px 8px;border:1px solid #393f5b;border-radius:20px;color:#c3ccff;white-space:nowrap}.progress{height:5px;background:#282b3b;border-radius:10px;overflow:hidden;margin:12px 0 6px}.progress span{height:100%;display:block;background:linear-gradient(90deg,#8caaff,#c4a3ff);border-radius:10px}.classes{grid-template-columns:repeat(3,minmax(0,1fr))}.classcard{padding:17px;cursor:pointer;transition:.15s}.classcard:hover,.resource:hover{border-color:#59638b;transform:translateY(-1px)}.classbadge{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#1e2439;color:var(--blue);font-weight:700;margin-bottom:15px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select,.field input,.field textarea,.field select{background:#0b0d14;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;min-width:0}.toolbar input{flex:1;min-width:180px}.resources{grid-template-columns:repeat(3,minmax(0,1fr))}.resource{padding:16px;min-width:0}.fileicon{height:100px;background:#171b29;border-radius:10px;display:grid;place-items:center;font-size:27px;color:var(--blue);margin-bottom:13px}.resource-title{overflow-wrap:anywhere}.resource-actions{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}.resource-actions .btn{font-size:11px;padding:7px 9px}.empty{border:1px dashed #3b4056;border-radius:14px;text-align:center;padding:36px 18px;color:var(--muted)}.empty .big{font-size:26px;margin-bottom:10px;color:var(--blue)}.empty h2{color:var(--text)}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:#b8bed2}.field input,.field textarea,.field select{width:100%}.field textarea{min-height:100px;resize:vertical}.modalback{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:#11141e;border:1px solid #343951;border-radius:18px;padding:24px;box-shadow:0 25px 90px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{border:0;background:transparent;color:var(--muted);font-size:22px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.notice{border:1px solid #383e57;background:#141827;padding:12px;border-radius:10px;color:#aeb6d2;font-size:12px;margin:14px 0}.toast{position:fixed;bottom:22px;right:22px;background:#20283a;border:1px solid #56658f;padding:12px 16px;border-radius:12px;z-index:30;box-shadow:0 12px 40px #0008}.question{font-size:21px;line-height:1.45;margin:22px 0}.answer{background:#171b2a;border:1px solid var(--line);border-radius:12px;padding:15px;margin:15px 0}.post{border:1px solid var(--line);border-radius:13px;padding:15px;margin:10px 0;background:#0d0f16}.attachment{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:9px;margin-top:8px}.footer{color:#626984;font-size:11px;text-align:center;padding-top:25px}@media(max-width:900px){.app{grid-template-columns:74px 1fr}.sidebar{padding:20px 9px}.brand{justify-content:center;padding:0}.brandtext,.navlabel,.navtext,.sidebottom{display:none}.nav button{justify-content:center;padding:12px 5px}.content{padding:25px 20px}.topbar{padding:0 20px}.classes,.resources{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.app{display:block}.sidebar{position:sticky;top:0;z-index:5;display:flex;flex-direction:row;align-items:center;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);overflow:auto}.brand{display:none}.nav{display:flex;gap:3px}.nav button{padding:9px 10px}.navicon{font-size:15px}.main{width:100%}.topbar{height:60px;padding:0 14px}.search{width:140px}.content{padding:22px 14px 40px}.headingrow{align-items:center}.headingrow h1{font-size:25px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{padding:12px 10px}.statvalue{font-size:22px}.statfoot{font-size:10px}.dashgrid,.split{grid-template-columns:1fr}.classes,.resources{grid-template-columns:1fr 1fr}.resource{padding:11px}.fileicon{height:72px}.top-actions .crumb{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><svg class="brandmark" viewBox="0 0 64 64" fill="none" aria-label="Hereditas logo"><path d="M8 18 35 4v13l13-5v13l8-3v34L35 46v12L8 43Z" stroke="#9EBBFF" stroke-width="3.2" stroke-linejoin="round"/><path d="M16 23 34 14M16 23v16l18 10V31M34 31l14-4M34 46l14 6V39M42 19l6-2v10" stroke="#BBA7FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="brandtext"><div class="brandname">HEREDITAS</div><div class="tagline">INHERITED SUCCESS</div></div></div>
<div><div class="navlabel">Workspace</div><nav class="nav" id="nav">
<button class="active" data-page="Today"><span class="navicon">◈</span><span class="navtext">Today</span></button>
<button data-page="Library"><span class="navicon">▤</span><span class="navtext">Library</span></button>
<button data-page="Study"><span class="navicon">✳</span><span class="navtext">Study</span></button>
<button data-page="Exam Room"><span class="navicon">◷</span><span class="navtext">Exam Room</span></button>
<button data-page="Mistakes"><span class="navicon">↗</span><span class="navtext">Mistakes</span></button>
<button data-page="Class Spaces"><span class="navicon">⌘</span><span class="navtext">Class Spaces</span></button>
</nav></div>
<div class="sidebottom"><strong>Your knowledge, connected.</strong>Keep your class materials together and turn them into focused study.</div>
</aside>
<main class="main"><header class="topbar"><div class="crumb" id="crumb">Workspace / Today</div><div class="top-actions"><input class="search" id="globalSearch" placeholder="⌕  Search your workspace" aria-label="Search workspace"><button class="btn primary" id="addTop">＋ Add material</button><div class="avatar">H</div></div></header><div class="content" id="content"></div></main>
</div><div id="modalroot"></div><div id="toastroot"></div>
<script>
const KEY='hereditas-prototype-v1';
const initial={resources:[],classes:[{id:'c1',name:'Biology 1',subject:'Biology',term:'Fall 2026',code:'BIO26',resources:[],posts:[]},{id:'c2',name:'IM-3 STEM',subject:'Mathematics',term:'Fall 2026',code:'IM326',resources:[],posts:[]},{id:'c3',name:'Spanish 2',subject:'Spanish',term:'Fall 2026',code:'SPA26',resources:[],posts:[]}],exams:[],mistakes:[],sessions:[],page:'Today'};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){state=structuredClone(initial)}
let page=state.page||'Today', activeClass=null, studyQueue=[], studyIndex=0, shownAnswer=false;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){state.page=page;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Storage is full. Try removing large attachments.')}}function toast(s){$('#toastroot').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$('#toastroot').innerHTML='',2600)}
function setPage(p){page=p;save();render();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}
function heading(eyebrow,title,desc,action=''){return `<div class="headingrow"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function empty(icon,title,desc,btn,label){return `<div class="empty"><div class="big">${icon}</div><h2>${title}</h2><p>${desc}</p>${btn?`<button class="btn primary" style="margin-top:16px" data-action="${btn}">${label}</button>`:''}</div>`}
function btn(label,action,cls='btn'){return `<button class="${cls}" data-action="${action}">${label}</button>`}
function fmtDate(d){if(!d)return 'No date set';return new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function resourceCard(r){return `<article class="resource"><div class="fileicon">${r.type==='PDF'?'▤':r.type==='Image'?'▧':'▧'}</div><strong class="resource-title">${esc(r.title)}</strong><small>${esc(r.course||'Unassigned')} · ${esc(r.type)} · ${fmtDate(r.date)}</small><small>${r.visibility==='Shared'?'Shared with class':'Private library'}</small><div class="resource-actions">${btn('Open',`open-resource:${r.id}`)}${btn('Study',`study-resource:${r.id}`)}${btn('Share',`share-resource:${r.id}`,'btn ghost')}${btn('⋯',`resource-menu:${r.id}`,'btn ghost')}</div></article>`}
function render(){
$('#crumb').textContent='Workspace / '+page;
let c=$('#content');
if(page==='Today'){
const soon=[...state.exams].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,2);
c.innerHTML=heading('SUNDAY, OCTOBER 18','Make today count.','Your academic workspace, in one place.',btn('＋ Add material','add-material','btn primary'))+
`<div class="grid stats"><div class="stat"><div class="statlabel">Library resources</div><div class="statvalue">${state.resources.length}</div><div class="statfoot">Your personal knowledge base</div></div><div class="stat"><div class="statlabel">Upcoming exams</div><div class="statvalue">${state.exams.length}</div><div class="statfoot">Keep preparation on track</div></div><div class="stat"><div class="statlabel">Class spaces</div><div class="statvalue">${state.classes.length}</div><div class="statfoot">Learn from your classmates</div></div></div>
<div class="grid dashgrid"><section><div class="panel"><div class="panelhead"><h2>Today's priorities</h2><span class="pill">YOUR NEXT STEPS</span></div>
<div class="task"><div class="taskicon">＋</div><div><strong>Build your study library</strong><small>Add class notes, worksheets, or a study guide to get started.</small></div>${btn('Add','add-material')}</div>
${state.mistakes.length?`<div class="task"><div class="taskicon">↗</div><div><strong>Revisit a missed question</strong><small>${state.mistakes.length} saved mistake${state.mistakes.length===1?'':'s'} ready for review.</small></div>${btn('Review','Mistakes')}</div>`:''}
${state.exams.length?`<div class="task"><div class="taskicon">◷</div><div><strong>Prepare for ${esc(state.exams[0].name)}</strong><small>${fmtDate(state.exams[0].date)} · ${esc(state.exams[0].course)}</small></div>${btn('Open','Exam Room')}</div>`:''}
</div><div class="panel"><div class="panelhead"><h2>Your classes</h2>${btn('View all','Class Spaces','mutedlink')}</div><div class="grid classes">${state.classes.slice(0,3).map(cl=>`<div class="classcard" data-action="open-class:${cl.id}"><div class="classbadge">${esc(cl.subject.slice(0,2).toUpperCase())}</div><strong>${esc(cl.name)}</strong><small>${esc(cl.term)} · ${cl.resources.length} shared resources</small></div>`).join('')}</div></div></section>
<section><div class="panel"><div class="panelhead"><h2>Upcoming exams</h2>${btn('＋','add-exam','mutedlink')}</div>${soon.length?soon.map(e=>`<div class="examcard"><div class="examtop"><div><strong>${esc(e.name)}</strong><small>${esc(e.course)} · ${fmtDate(e.date)}</small></div><span class="pill">${e.date?Math.ceil((new Date(e.date+'T23:59:59')-new Date())/86400000)+' days':'Date TBD'}</span></div><div class="progress"><span style="width:${e.progress||0}%"></span></div><small>${e.progress||0}% checklist complete · Mastery estimate unavailable</small></div>`).join(''):empty('◷','No exams on the horizon','Add an exam to gather your materials and make a review plan.','add-exam','Create an exam')}</div>
<div class="panel"><div class="panelhead"><h2>Continue studying</h2></div>${state.sessions.length?state.sessions.slice(-2).reverse().map(s=>`<div class="task"><div class="taskicon">✳</div><div><strong>${esc(s.title)}</strong><small>${s.done||0} questions completed</small></div>${btn('Resume',`study-resource:${s.resourceId}`)}</div>`).join(''):empty('✳','Your next session starts here','Choose a resource and practice active recall.','Study','Start studying')}</div>
<div class="panel"><div class="panelhead"><h2>Recent class activity</h2></div>${state.classes.some(cl=>cl.posts.length)?state.classes.flatMap(cl=>cl.posts.map(p=>({cl,p}))).slice(-3).reverse().map(({cl,p})=>`<div class="task"><div class="taskicon">⌘</div><div><strong>${esc(p.title||'Class post')}</strong><small>${esc(cl.name)} · ${p.files?.length||0} attachment(s)</small></div></div>`).join(''): `<p style="font-size:12px">Classroom posts and shared resources will appear here when you add them.</p>`}</div></section></div>`;
}else if(page==='Library'){
c.innerHTML=heading('YOUR KNOWLEDGE BASE','Library','Everything you keep for class, searchable and ready to study.',btn('＋ Add material','add-material','btn primary'))+
`<div class="toolbar"><input id="libsearch" placeholder="Search titles, courses, topics…"><select id="libcourse"><option value="">All courses</option>${[...new Set(state.resources.map(r=>r.course).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="libtype"><option value="">All types</option><option>PDF</option><option>Image</option><option>Document</option><option>Note</option></select><select id="libsort"><option value="new">Newest first</option><option value="az">A–Z</option></select></div><div id="resourcegrid" class="grid resources"></div><div class="notice">Prototype storage: resources are saved in this browser on this device. This does not upload them to a shared server.</div>`;
drawResources();
}else if(page==='Study'){
c.innerHTML=heading('ACTIVE LEARNING','Study','Start from your own material. Recall first, reveal second.')+
(state.resources.length?`<div class="panel"><h2>Choose a resource</h2><p>Select a resource to start a focused study session. This prototype provides a reusable active-recall prompt; document-aware question generation is not connected yet.</p><div class="grid resources" style="margin-top:16px">${state.resources.map(r=>`<div class="resource"><div class="fileicon">✳</div><strong>${esc(r.title)}</strong><small>${esc(r.course||'Unassigned')}</small><div class="resource-actions">${btn('Start session',`study-resource:${r.id}`,'btn primary')}</div></div>`).join('')}</div></div>`:empty('✳','Start with your materials','Add notes or a worksheet to begin a study session.','add-material','Add material'))+
`<div class="panel"><h2>How Hereditas study works</h2><div class="grid split"><div class="task"><div class="taskicon">01</div><div><strong>Recall</strong><small>Try to explain an idea before checking your notes.</small></div></div><div class="task"><div class="taskicon">02</div><div><strong>Reflect</strong><small>Mark what you know and save difficult questions to Mistakes.</small></div></div></div></div>`;
}else if(page==='Exam Room'){
c.innerHTML=heading('PREPARE WITH PURPOSE','Exam Room','Bring your exam topics, resources, and review plan together.',btn('＋ Create exam','add-exam','btn primary'))+
(state.exams.length?`<div class="grid classes">${state.exams.map(e=>`<div class="examcard"><div class="examtop"><div><strong>${esc(e.name)}</strong><small>${esc(e.course)} · ${fmtDate(e.date)}</small></div><span class="pill">${e.progress||0}% checked</span></div><div class="progress"><span style="width:${e.progress||0}%"></span></div><small>Topics: ${esc(e.topics||'Not specified')}</small><div class="resource-actions">${btn('Edit checklist',`exam-progress:${e.id}`)}${btn('Delete',`delete-exam:${e.id}`,'btn ghost')}</div></div>`).join('')}</div>`:empty('◷','Your exam workspace','Create an exam and connect the resources you need to review.','add-exam','Create your first exam'))+
`<div class="notice">Readiness is not estimated until the app has real evidence of topic mastery. Checklist completion is shown separately.</div>`;
}else if(page==='Mistakes'){
c.innerHTML=heading('LEARN FROM EVERY ATTEMPT','Mistakes','Keep a record of what tripped you up and practice it again.',btn('＋ Save a mistake','add-mistake','btn primary'))+
(state.mistakes.length?state.mistakes.map(m=>`<div class="panel"><div class="panelhead"><h2>${esc(m.question)}</h2><span class="pill">${esc(m.course||'General')}</span></div><p><b style="color:#c7ceff">Correct answer:</b> ${esc(m.answer)}</p>${m.explanation?`<p style="margin-top:8px"><b style="color:#c7ceff">Why:</b> ${esc(m.explanation)}</p>`:''}<div class="resource-actions">${btn('Practice again',`practice-mistake:${m.id}`)}${btn('Delete','delete-mistake:'+m.id,'btn ghost')}</div></div>`).join(''):empty('↗','Your mistake notebook is empty','Save a question you missed, the right answer, and what you learned.','add-mistake','Save a mistake'));
}else if(page==='Class Spaces'){
c.innerHTML=heading('LEARN TOGETHER','Class Spaces','A shared home for resources from the classes you actually take.',`<div style="display:flex;gap:8px">${btn('Join','join-class')}${btn('＋ Create','create-class','btn primary')}</div>`)+
(state.classes.length?`<div class="grid classes">${state.classes.map(cl=>`<div class="classcard" data-action="open-class:${cl.id}"><div class="classbadge">${esc(cl.subject.slice(0,2).toUpperCase())}</div><strong>${esc(cl.name)}</strong><small>${esc(cl.subject)} · ${esc(cl.term)}</small><div style="margin-top:13px;display:flex;justify-content:space-between;align-items:center"><span class="pill">${esc(cl.code)}</span><small>${cl.resources.length} resources · ${cl.posts.length} posts</small></div></div>`).join('')}</div>`:empty('⌘','Start a Class Space','Create a space for your class or join one with an invitation code.','create-class','Create a class'))+
`<div class="notice">Local demo: class spaces and posts currently live only in this browser. Real cross-user sharing needs authentication, a database, and protected file storage.</div>`;
}
}
function drawResources(){const grid=$('#resourcegrid');if(!grid)return;let q=($('#libsearch')?.value||'').toLowerCase(),course=$('#libcourse')?.value||'',type=$('#libtype')?.value||'',sort=$('#libsort')?.value||'new';let a=state.resources.filter(r=>(r.title+' '+r.course+' '+r.topic).toLowerCase().includes(q)&&(!course||r.course===course)&&(!type||r.type===type));a.sort((x,y)=>sort==='az'?x.title.localeCompare(y.title):(y.created||0)-(x.created||0));grid.innerHTML=a.length?a.map(resourceCard).join(''):empty('▤','No matching resources','Try a different search or add a new material.','add-material','Add material')}
function modal(title,body,submitLabel,submitFn){$('#modalroot').innerHTML=`<div class="modalback" id="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h2>${esc(title)}</h2><button class="close" data-action="close-modal" aria-label="Close">×</button></div><div id="modalbody">${body}</div><div class="modalfoot"><button class="btn ghost" data-action="close-modal">Cancel</button><button class="btn primary" id="modalsubmit">${submitLabel}</button></div></section></div>`;$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});$('#modalsubmit').onclick=submitFn}
function closeModal(){$('#modalroot').innerHTML=''}
function val(id){return document.getElementById(id)?.value?.trim()||''}
function addMaterial(){modal('Add material',`<div class="field"><label>Title</label><input id="mtitle" placeholder="e.g. Cell structure review" required></div><div class="field"><label>Course</label><input id="mcourse" placeholder="e.g. Biology 1"></div><div class="field"><label>Topic or unit</label><input id="mtopic" placeholder="e.g. Unit 3 · Cells"></div><div class="field"><label>Resource type</label><select id="mtype"><option>Note</option><option>PDF</option><option>Image</option><option>Document</option></select></div><div class="field"><label>Attach a file (optional)</label><input id="mfile" type="file" accept=".pdf,.png,.jpg,.jpeg,.txt,.doc,.docx,.ppt,.pptx"></div><div class="notice">Files and metadata are saved in this browser only. Large files may exceed browser storage limits.</div>`,'Save resource',async()=>{let title=val('mtitle');if(!title){toast('Please add a title.');return}let file=$('#mfile').files[0],data=null;if(file){if(file.size>3*1024*1024){toast('For this local demo, files must be under 3 MB.');return}data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});if(file.type==='application/pdf')$('#mtype').value='PDF';else if(file.type.startsWith('image/'))$('#mtype').value='Image'}state.resources.push({id:crypto.randomUUID(),title,course:val('mcourse'),topic:val('mtopic'),type:$('#mtype').value,fileName:file?.name||'',fileSize:file?.size||0,data,visibility:'Private',date:new Date().toISOString().slice(0,10),created:Date.now()});save();closeModal();render();toast('Resource saved to this browser.')})}
function addExam(){modal('Create an exam',`<div class="field"><label>Exam name</label><input id="ename" placeholder="e.g. Unit 4 Chemistry Exam"></div><div class="field"><label>Course</label><input id="ecourse" placeholder="e.g. Chemistry"></div><div class="field"><label>Exam date</label><input id="edate" type="date"></div><div class="field"><label>Topics covered</label><textarea id="etopics" placeholder="List the units and topics you need to know"></textarea></div><div class="notice">Progress tracks the checklist only; mastery readiness is not available without practice-performance data.</div>`,'Create exam',()=>{if(!val('ename'))return toast('Enter an exam name.');state.exams.push({id:crypto.randomUUID(),name:val('ename'),course:val('ecourse'),date:val('edate'),topics:val('etopics'),progress:0});save();closeModal();render();toast('Exam created.')})}
function addMistake(prefill=''){modal('Save a mistake',`<div class="field"><label>Question or concept</label><textarea id="mq" placeholder="What did you get wrong?">${esc(prefill)}</textarea></div><div class="field"><label>Correct answer</label><textarea id="ma" placeholder="What is the correct answer?"></textarea></div><div class="field"><label>Why / explanation</label><textarea id="me" placeholder="What caused the mistake?"></textarea></div><div class="field"><label>Course or topic</label><input id="mc" placeholder="e.g. Biology · Cell transport"></div>`,'Save mistake',()=>{if(!val('mq')||!val('ma'))return toast('Add the question and correct answer.');state.mistakes.push({id:crypto.randomUUID(),question:val('mq'),answer:val('ma'),explanation:val('me'),course:val('mc')});save();closeModal();render();toast('Saved to Mistakes.')})}
function createClass(){modal('Create a Class Space',`<div class="field"><label>Class name</label><input id="cn" placeholder="e.g. AP Chemistry — Period 2"></div><div class="field"><label>Subject</label><input id="cs" placeholder="e.g. Chemistry"></div><div class="field"><label>Term</label><input id="ct" value="Fall 2026"></div><div class="notice">A join code is generated for this local prototype. It does not invite other users unless a shared backend is connected.</div>`,'Create class',()=>{if(!val('cn'))return toast('Enter a class name.');let code=Math.random().toString(36).slice(2,7).toUpperCase();state.classes.push({id:crypto.randomUUID(),name:val('cn'),subject:val('cs')||'General',term:val('ct'),code,resources:[],posts:[]});save();closeModal();render();toast('Class Space created · code '+code)})}
function joinClass(){modal('Join a Class Space',`<div class="field"><label>Invitation code</label><input id="jcode" placeholder="e.g. BIO26"></div><div class="notice">This demo can join spaces already stored in this browser. Cross-user invitations require a backend.</div>`,'Join class',()=>{let cl=state.classes.find(c=>c.code.toLowerCase()===val('jcode').toLowerCase());if(!cl)return toast('No matching local class found.');closeModal();openClass(cl.id)})}
function openClass(id){activeClass=id;let cl=state.classes.find(c=>c.id===id);if(!cl)return;page='Class Spaces';render();let c=$('#content');c.innerHTML=heading('CLASS SPACE',esc(cl.name),`${esc(cl.subject)} · ${esc(cl.term)} · Invite code: ${esc(cl.code)}`,`<button class="btn" data-action="create-post:${cl.id}">＋ Create post</button>`)+`<div class="grid split"><section class="panel"><div class="panelhead"><h2>Shared resources</h2><span class="pill">${cl.resources.length}</span></div>${cl.resources.length?cl.resources.map(id=>state.resources.find(r=>r.id===id)).filter(Boolean).map(r=>`<div class="attachment"><div><strong>${esc(r.title)}</strong><small>${esc(r.type)} · ${esc(r.course||cl.name)}</small></div>${btn('Open','open-resource:'+r.id)}</div>`).join(''):empty('▤','No shared resources yet','Share a Library item or attach files to a post.')}</section><section class="panel"><div class="panelhead"><h2>Class posts</h2><span class="pill">${cl.posts.length}</span></div>${cl.posts.length?cl.posts.slice().reverse().map(p=>`<article class="post"><strong>${esc(p.title||'Class post')}</strong><p style="margin-top:7px">${esc(p.body)}</p><small style="margin-top:8px">${fmtDate(p.date)}</small>${(p.files||[]).map(f=>`<div class="attachment"><div><strong>${esc(f.name)}</strong><small>${esc(f.type)} · ${Math.ceil(f.size/1024)} KB</small></div><button class="btn" data-action="download-postfile:${cl.id}:${p.id}:${f.id}">Download</button></div>`).join('')}</article>`).join(''):empty('⌘','No posts yet','Share a helpful note or ask your class a question.','create-post:'+cl.id,'Create first post')}</section></div><div class="notice">Local prototype: posts and attachments are visible only in this browser. Do not upload sensitive student information.</div>`}
function createPost(id){let cl=state.classes.find(c=>c.id===id);if(!cl)return;modal('Create a class post',`<div class="field"><label>Post title (optional)</label><input id="ptitle" placeholder="e.g. Review sheet for Friday"></div><div class="field"><label>Message</label><textarea id="pbody" placeholder="Share context or ask a question…"></textarea></div><div class="field"><label>Attach files (up to 5, each under 2 MB)</label><input id="pfiles" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.txt,.doc,.docx,.ppt,.pptx"></div><div id="pfilelist" class="notice">Attach assignments, notes, worksheets, or other class materials. You can also share an existing Library resource below.</div><div class="field"><label>Attach from Library</label><select id="plib"><option value="">Choose a resource…</option>${state.resources.map(r=>`<option value="${r.id}">${esc(r.title)}${r.visibility==='Shared'?' (already shared)':''}</option>`).join('')}</select></div><div class="notice">Publishing shares the selected items in this local Class Space. A real multi-user classroom requires authenticated backend storage and access controls.</div>`,'Publish post',async()=>{let files=[...$('#pfiles').files];if(files.length>5||files.some(f=>f.size>2*1024*1024)){toast('Maximum 5 files, each under 2 MB.');return}let saved=[];for(const f of files){let data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});saved.push({id:crypto.randomUUID(),name:f.name,type:f.type||'File',size:f.size,data})}let lib=val('plib');if(lib){let r=state.resources.find(r=>r.id===lib);if(r){r.visibility='Shared';cl.resources.push(r.id);saved.push({id:crypto.randomUUID(),name:r.title,type:r.type,size:r.fileSize||0,resourceId:r.id})}}cl.posts.push({id:crypto.randomUUID(),title:val('ptitle'),body:val('pbody'),date:new Date().toISOString().slice(0,10),files:saved});save();closeModal();openClass(id);toast('Post saved in this browser.')})}
function openResource(id){let r=state.resources.find(x=>x.id===id);if(!r)return;if(r.data){if(r.type==='PDF'||r.type==='Image'){let w=window.open();if(w){w.document.write(`<title>${esc(r.title)}</title><body style="margin:0;background:#111;display:grid;place-items:center;min-height:100vh"><${r.type==='Image'?'img':'iframe'} src="${r.data}" style="width:100%;height:100vh;object-fit:contain;border:0"></${r.type==='Image'?'img':'iframe'}></body>`)}else toast('Allow pop-ups to preview this file.')}else{let a=document.createElement('a');a.href=r.data;a.download=r.fileName||r.title;a.click()}}else toast('Resource details: '+r.title+' · '+(r.topic||'No topic set'))}
function studyResource(id){let r=state.resources.find(x=>x.id===id);if(!r)return;let session={id:crypto.randomUUID(),title:r.title,resourceId:r.id,done:0};state.sessions.push(session);save();let prompt=r.topic?`Explain the most important ideas in “${r.topic}” from ${r.title}.`:`What are the three most important ideas in “${r.title}”?`;modal('Active recall',`<div class="eyebrow">${esc(r.course||'STUDY SESSION')}</div><div class="question">${esc(prompt)}</div><p>Try answering from memory before revealing your notes. This starter prompt is not extracted from the file.</p><div id="answerarea"></div><div class="field" style="margin-top:16px"><label>Your attempt (optional)</label><textarea id="attempt" placeholder="Write what you remember…"></textarea></div>`,'Reveal reflection',()=>{let area=$('#answerarea');if(!shownAnswer){shownAnswer=true;area.innerHTML=`<div class="answer"><strong>Reflection check</strong><p style="margin-top:7px">Compare your answer with the original material. This prototype has not analyzed the document, so it cannot verify a correct answer.</p></div>`;$('#modalsubmit').textContent='Finish session';return}shownAnswer=false;session.done++;save();closeModal();if(val('attempt').length>5)addMistake(val('attempt'));else{render();toast('Study session saved. Compare your answer with the source material.')}});shownAnswer=false}
function shareResource(id){let r=state.resources.find(x=>x.id===id);if(!r)return;modal('Share to a Class Space',`<p>Choose a class to share <b>${esc(r.title)}</b> with.</p><div class="field"><label>Class Space</label><select id="shareclass">${state.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="notice">Sharing changes the resource's visibility and adds a reference to the selected local class. The original Library item remains in place.</div>`,'Share resource',()=>{let cl=state.classes.find(c=>c.id===val('shareclass'));if(!cl)return;cl.resources.push(r.id);r.visibility='Shared';save();closeModal();render();toast('Resource shared in this browser.')})}
function resourceMenu(id){let r=state.resources.find(x=>x.id===id);if(!r)return;modal('Resource options',`<p><b>${esc(r.title)}</b></p><div class="field"><label>Rename</label><input id="renametitle" value="${esc(r.title)}"></div><div class="field"><label>Visibility</label><select id="rvisibility"><option ${r.visibility==='Private'?'selected':''}>Private</option><option ${r.visibility==='Shared'?'selected':''}>Shared</option></select></div><div class="notice">Deleting the Library item may leave a missing reference in a class. This demo will remove its references as well.</div>`,'Save changes',()=>{if(!val('renametitle'))return toast('Title cannot be empty.');r.title=val('renametitle');r.visibility=val('rvisibility');save();closeModal();render();toast('Resource updated.')});$('#modalroot .modalfoot').insertAdjacentHTML('afterbegin',`<button class="btn danger" id="deleteres">Delete</button>`);$('#deleteres').onclick=()=>{if(confirm('Delete this resource from this browser?')){state.resources=state.resources.filter(x=>x.id!==id);state.classes.forEach(c=>{c.resources=c.resources.filter(x=>x!==id);c.posts.forEach(p=>p.files=(p.files||[]).filter(f=>f.resourceId!==id))});save();closeModal();render();toast('Resource deleted.')}}}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){setPage(nav.dataset.page);return}let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action;if(a==='add-material')addMaterial();else if(a==='add-exam')addExam();else if(a==='add-mistake')addMistake();else if(a==='create-class')createClass();else if(a==='join-class')joinClass();else if(a==='close-modal')closeModal();else if(a==='Study')setPage('Study');else if(a==='Class Spaces')setPage('Class Spaces');else if(a.startsWith('open-class:'))openClass(a.split(':')[1]);else if(a.startsWith('create-post:'))createPost(a.split(':')[1]);else if(a.startsWith('open-resource:'))openResource(a.split(':')[1]);else if(a.startsWith('study-resource:'))studyResource(a.split(':')[1]);else if(a.startsWith('share-resource:'))shareResource(a.split(':')[1]);else if(a.startsWith('resource-menu:'))resourceMenu(a.split(':')[1]);else if(a.startsWith('delete-exam:')){state.exams=state.exams.filter(x=>x.id!==a.split(':')[1]);save();render();toast('Exam removed.')}else if(a.startsWith('exam-progress:')){let ex=state.exams.find(x=>x.id===a.split(':')[1]);if(ex){let n=prompt('Checklist completion percent (0–100)',String(ex.progress||0));if(n!==null&&Number.isFinite(+n)&&+n>=0&&+n<=100){ex.progress=+n;save();render()}}}else if(a.startsWith('delete-mistake:')){state.mistakes=state.mistakes.filter(x=>x.id!==a.split(':')[1]);save();render();toast('Mistake removed.')}else if(a.startsWith('practice-mistake:')){let m=state.mistakes.find(x=>x.id===a.split(':')[1]);if(m)modal('Practice a mistake',`<div class="question">${esc(m.question)}</div><p>Try to answer from memory before checking your saved explanation.</p><div class="field"><label>Your answer</label><textarea id="practiceanswer"></textarea></div><div id="practicereveal"></div>`,'Check answer',()=>{$('#practicereveal').innerHTML=`<div class="answer"><strong>Saved answer</strong><p>${esc(m.answer)}</p><p style="margin-top:8px">${esc(m.explanation)}</p></div>`;$('#modalsubmit').textContent='Done';$('#modalsubmit').onclick=()=>{closeModal();toast('Keep practicing until you can explain it confidently.')};$('#modalsubmit').textContent='Done'})}else if(a.startsWith('download-postfile:')){let [,cid,pid,fid]=a.split(':');let cl=state.classes.find(x=>x.id===cid),p=cl?.posts.find(x=>x.id===pid),f=p?.files.find(x=>x.id===fid);if(f?.resourceId){openResource(f.resourceId)}else if(f?.data){let link=document.createElement('a');link.href=f.data;link.download=f.name;link.click()}else toast('File data is not available.')}});
$('#addTop').onclick=addMaterial;
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value.toLowerCase();setPage('Library');setTimeout(()=>{let i=$('#libsearch');if(i){i.value=q;i.dispatchEvent(new Event('input'))}},0)}});
document.addEventListener('input',e=>{if(['libsearch','libcourse','libtype','libsort'].includes(e.target.id))drawResources();if(e.target.id==='pfiles'){let fs=[...e.target.files];$('#pfilelist').textContent=fs.length?fs.map(f=>`${f.name} · ${(f.size/1024).toFixed(0)} KB`).join(' | '):'Attach assignments, notes, worksheets, or other class materials.'}});
render();
</script>
</body></html>
